services:
  graph:
    profiles: [""]
    build:
      context: .
    # Bound to 127.0.0.1, not the bare "8000:8000" that publishes on every interface: the
    # GRAPHITI_API_KEY default below is committed to this repo, so the bare form would hand the
    # graph to anyone on a shared network. Localhost is all the README examples and demo.sh
    # need; drop the prefix deliberately to reach this from another machine, and set your own
    # key in the same edit.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      neo4j:
        condition: service_healthy
    # Everything else the app reads comes straight from .env, so the settings documented
    # in .env.example reach the container instead of being silently dropped. Listing them
    # here one by one would mean a blank value for each one the user left out, and a blank
    # is not the same as unset: SEMAPHORE_LIMIT is read as int(os.getenv(...)), so '' is a
    # crash on import. Absent from .env means absent from the environment.
    env_file:
      - path: .env
        required: false
    # Compose-specific wiring, which has to win over whatever .env says: these hostnames
    # only make sense on the compose network. environment takes precedence over env_file.
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Auth is mandatory, so the stack needs a key to boot. Defaulted like NEO4J_PASSWORD
      # below, and named insecure- on purpose: it is committed to this repo, so it protects
      # nothing. The localhost binding above is what keeps that from mattering, not this value.
      - GRAPHITI_API_KEY=${GRAPHITI_API_KEY:-insecure-local-dev-key}
      - NEO4J_URI=bolt://neo4j:${NEO4J_PORT:-7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - DB_BACKEND=neo4j
  neo4j:
    image: neo4j:5.26.2
    profiles: [""]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${NEO4J_PORT:-7474} || exit 1",
        ]
      interval: 1s
      timeout: 10s
      retries: 10
      start_period: 3s
    # Localhost-bound for the same reason as the graph service above, and with more at
    # stake: NEO4J_PASSWORD defaults to `password` here, and Bolt is unmediated write
    # access to the graph.
    ports:
      - "127.0.0.1:7474:7474" # HTTP
      - "127.0.0.1:${NEO4J_PORT:-7687}:${NEO4J_PORT:-7687}" # Bolt
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}

  falkordb:
    # Kept in step with render.yaml so local dev matches what Render runs.
    image: falkordb/falkordb:v4.20.1
    profiles: ["falkordb"]
    # Localhost-bound, as above. FalkorDB has no password set at all — on Render it is a
    # pserv reachable only from graphiti-api, and this is the closest local equivalent.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    environment:
      # REDIS_ARGS goes to redis-server; FALKORDB_ARGS goes to the module. The flags that
      # used to sit in FALKORDB_ARGS were redis-server flags in the module's slot, and
      # both were already the defaults. Append-only matches what render.yaml runs.
      - REDIS_ARGS=--appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 1s
      timeout: 10s
      retries: 10
      start_period: 3s
  graph-falkordb:
    build:
      args:
        INSTALL_FALKORDB: "true"
      context: .
    profiles: ["falkordb"]
    # Localhost-bound, as above.
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 10s
      timeout: 5s
      retries: 3
    # See the note on the graph service above.
    env_file:
      - path: .env
        required: false
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # See the note on the graph service above.
      - GRAPHITI_API_KEY=${GRAPHITI_API_KEY:-insecure-local-dev-key}
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_DATABASE=default_db
      - DB_BACKEND=falkordb

volumes:
  neo4j_data:
  falkordb_data:
